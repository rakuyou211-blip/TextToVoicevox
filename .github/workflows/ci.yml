name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        # ubuntu-latest（26.04）には Python 3.9 が無いので、3.9 は ubuntu-24.04 で
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pypdfium2 pillow requests pytest

      - name: Syntax check
        run: python -m py_compile main.py core.py ocr_mac.py ocr_helper.py

      - name: Run tests
        if: runner.os != 'macOS'
        run: pytest tests/ -v

      # macOS の Tk は、1つのプロセスで App（Tk のルート窓）を何十回も作っては壊すと、
      # 途中から内部が壊れ、そのあと最初に窓を扱った所で落ちる（落ちる場所は毎回ちがう）。
      # 実際のアプリは1起動で窓1つなので、GUIテストは1件ずつ別プロセスで流す
      # （起動中の小窓は T2V_NO_SPLASH で出さない。出すと別プロセスでも固まることがあった）。
      # 1件ごとに時間切れを付け、止まったら行を書き出す。テストは1件も飛ばさない。
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: |
          pytest tests/ -v --ignore=tests/test_gui.py
          python tools/run_each.py tests/test_gui.py --timeout 90

  # Windows の「1行でかんたん導入」を、この commit の install.ps1 で実際に流す。
  # 利用者と同じく raw.githubusercontent から irm | iex で読む（文字コードの扱いも本番と同じ）。
  # 本体はネットから取らず、チェックアウトした中身（T2V_SRC）を入れる。
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: One-line installer
        shell: powershell
        env:
          T2V_SRC: ${{ github.workspace }}
          T2V_DIR: ${{ runner.temp }}\t2v
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex

      - name: Check the installed app
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 't2v'
          foreach ($f in @('main.py', 'core.py', 'venv\Scripts\pythonw.exe', 'assets\app-icon.ico')) {
            if (-not (Test-Path -LiteralPath (Join-Path $d $f))) { throw "missing: $f" }
          }
          & (Join-Path $d 'venv\Scripts\python.exe') -c "import PIL, pypdfium2, requests, tkinter; print('deps ok')"
          if ($LASTEXITCODE) { throw 'dependencies are not installed' }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $p = Join-Path $folder 'TextToVoicevox.lnk'
            if (-not (Test-Path -LiteralPath $p)) { throw "shortcut missing: $p" }
            $lnk = $shell.CreateShortcut($p)
            if ($lnk.TargetPath -ne (Join-Path $d 'venv\Scripts\pythonw.exe')) { throw "bad target: $($lnk.TargetPath)" }
            Write-Host "shortcut ok: $p -> $($lnk.TargetPath) $($lnk.Arguments)"
          }

      - name: Re-run keeps user data (update)
        shell: powershell
        env:
          T2V_SRC: ${{ github.workspace }}
          T2V_DIR: ${{ runner.temp }}\t2v
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: |
          $d = $env:T2V_DIR
          Set-Content -LiteralPath (Join-Path $d 'settings.json') -Value '{"keep": true}' -Encoding UTF8
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (-not (Select-String -LiteralPath (Join-Path $d 'settings.json') -Pattern 'keep' -Quiet)) { throw 'settings.json was lost' }
          Write-Host 'update kept settings.json'

      # Windows の「設定 → アプリ」に載り、そこから消せる。登録されたコマンドを、Windows と同じく
      # 1行のまま動かす（uninstall.ps1）。フォルダ・アイコン・登録が残らないことを確かめる
      - name: Listed in Settings > Apps, and uninstalls from there
        shell: powershell
        env:
          T2V_YES: "1"
        run: |
          $d = Join-Path $env:RUNNER_TEMP 't2v'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TextToVoicevox'
          $e = Get-ItemProperty -LiteralPath $key
          if ($e.InstallLocation -ne $d) { throw "bad InstallLocation: $($e.InstallLocation)" }
          if ($e.DisplayName -ne 'TextToVoicevox' -or -not $e.DisplayVersion) { throw "bad name or version: $($e.DisplayName) $($e.DisplayVersion)" }
          if (-not (Test-Path -LiteralPath $e.DisplayIcon)) { throw "icon missing: $($e.DisplayIcon)" }
          Write-Host "listed: $($e.DisplayName) $($e.DisplayVersion), $($e.EstimatedSize) KB"
          Write-Host "uninstall: $($e.UninstallString)"
          if ($e.UninstallString -notmatch '^"([^"]+)"\s+(.*)$') { throw 'UninstallString is not "exe" args' }
          $p = Start-Process -FilePath $Matches[1] -ArgumentList $Matches[2] -Wait -PassThru -NoNewWindow
          if ($p.ExitCode) { throw "uninstall failed ($($p.ExitCode))" }
          if (Test-Path -LiteralPath $d) { throw 'the app folder is still there' }
          if (Test-Path -LiteralPath $key) { throw 'still listed in Settings > Apps' }
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            if (Test-Path -LiteralPath (Join-Path $folder 'TextToVoicevox.lnk')) { throw "icon left in $folder" }
          }
          Write-Host 'uninstall ok'

      # 利用者と同じ道：GitHub の最新リリースを取ってきて入れる（T2V_SRC なし）。
      # そのリリースに Python 入りの版があればそれを、無ければ zip と venv で入れる。
      # zip の展開で日本語のファイル名（起動.pyw）が崩れないことも確かめる。
      - name: One-line installer from the latest release
        shell: powershell
        env:
          T2V_DIR: ${{ runner.temp }}\t2v_release
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          $d = $env:T2V_DIR
          $py = Join-Path $d 'runtime\python.exe'
          if (-not (Test-Path -LiteralPath $py)) { $py = Join-Path $d 'venv\Scripts\python.exe' }
          foreach ($f in @((Join-Path $d 'main.py'), (Join-Path $d 'core.py'), $py)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing: $f" }
          }
          # \u8d77\u52d5.pyw is the launcher (checked from Python to keep this script ASCII-only)
          & $py -c "import os,sys; sys.exit(0 if '\u8d77\u52d5.pyw' in os.listdir(sys.argv[1]) else 1)" $d
          if ($LASTEXITCODE) { throw 'Japanese file names were broken when extracting the release zip' }
          Write-Host "release install ok ($py)"

  # 1行導入が入れる「Python 入りの版」を、この commit の中身で作って入れてみる
  # （Release では release.yml が同じ物を作って添付する）。作るときに python.org と PyPI から落とす。
  # 入れる人の PC には Python が要らない。ブラウザ用の zip にしない理由は tools/make_bundle.py
  bundle-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python-included app
        run: python tools/make_bundle.py dist

      - name: One-line installer with that build
        shell: powershell
        env:
          T2V_BUNDLE: ${{ github.workspace }}\dist\TextToVoicevox_OneLine_Win64.zip
          T2V_DIR: ${{ runner.temp }}\t2v
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex

      - name: Check the installed app
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 't2v'
          foreach ($f in @('main.py', 'runtime\pythonw.exe', 'ocr_engine\ok.txt', 'assets\app-icon.ico', 'THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $d $f))) { throw "missing: $f" }
          }
          if (Test-Path -LiteralPath (Join-Path $d 'venv')) { throw 'the Python-included app should not make a venv' }
          & (Join-Path $d 'runtime\python.exe') -c "import sys, tkinter, PIL, pypdfium2, requests, janome, core; tkinter.Tcl(); assert sys.flags.isolated; print(sys.version)"
          if ($LASTEXITCODE) { throw 'the bundled Python cannot load the app parts' }
          & (Join-Path $d 'ocr_engine\python\python.exe') (Join-Path $d 'ocr_helper.py') --selftest
          if ($LASTEXITCODE) { throw 'the bundled OCR engine cannot read' }
          $shell = New-Object -ComObject WScript.Shell
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $lnk = $shell.CreateShortcut((Join-Path $folder 'TextToVoicevox.lnk'))
            if ($lnk.TargetPath -ne (Join-Path $d 'runtime\pythonw.exe')) { throw "bad target: $($lnk.TargetPath)" }
          }
          # Open it the same way as the icon, and see that it keeps running
          $p = Start-Process -FilePath (Join-Path $d 'runtime\pythonw.exe') -ArgumentList ('"' + (Join-Path $d 'main.py') + '"') -WorkingDirectory $d -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Get-ChildItem -LiteralPath $d -Filter '*.log' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
            throw "the app exited early ($($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'bundle install ok'

      - name: Re-run keeps user data (update)
        shell: powershell
        env:
          T2V_BUNDLE: ${{ github.workspace }}\dist\TextToVoicevox_OneLine_Win64.zip
          T2V_DIR: ${{ runner.temp }}\t2v
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: |
          $d = $env:T2V_DIR
          Set-Content -LiteralPath (Join-Path $d 'settings.json') -Value '{"keep": true}' -Encoding UTF8
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (-not (Select-String -LiteralPath (Join-Path $d 'settings.json') -Pattern 'keep' -Quiet)) { throw 'settings.json was lost' }
          if (-not (Test-Path -LiteralPath (Join-Path $d 'runtime\pythonw.exe'))) { throw 'runtime missing after update' }
          Write-Host 'update kept settings.json'

      # 消す1行（irm | iex で uninstall.ps1）。Python 入りの版も、フォルダ・アイコン・登録が残らない
      - name: One-line uninstaller
        shell: powershell
        env:
          T2V_DIR: ${{ runner.temp }}\t2v
          T2V_YES: "1"
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TextToVoicevox'
          if (-not (Test-Path -LiteralPath $key)) { throw 'the installer did not list the app in Settings > Apps' }
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/uninstall.ps1" | iex
          if (Test-Path -LiteralPath $env:T2V_DIR) { throw 'the app folder is still there' }
          if (Test-Path -LiteralPath $key) { throw 'still listed in Settings > Apps' }
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            if (Test-Path -LiteralPath (Join-Path $folder 'TextToVoicevox.lnk')) { throw "icon left in $folder" }
          }
          Write-Host 'one-line uninstall ok'

  # Mac の「1行でかんたん導入」を、この commit の install.sh で実際に流す。
  # 利用者と同じく raw.githubusercontent から curl | bash で読む。
  # 1回目は「Python が無い Mac」を想定して、自分用 Python（python-build-standalone）を入れる道を通す。
  install-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: One-line installer (own Python)
        env:
          T2V_SRC: ${{ github.workspace }}
          T2V_DIR: ${{ runner.temp }}/t2v
          T2V_APPS: ${{ runner.temp }}/apps
          T2V_PY_DIR: ${{ runner.temp }}/py312
          T2V_OWN_PYTHON: "1"
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash

      - name: Check the installed app
        run: |
          set -e
          d="$RUNNER_TEMP/t2v"
          app="$RUNNER_TEMP/apps/TextToVoicevox.app"
          for f in main.py core.py venv_mac/bin/python; do test -e "$d/$f" || { echo "missing: $f"; exit 1; }; done
          "$d/venv_mac/bin/python" -c "import sys, tkinter, PIL, pypdfium2, requests, Vision; print(sys.executable, sys.version, 'Tk', tkinter.TkVersion); assert tkinter.TkVersion >= 8.6"
          "$d/venv_mac/bin/python" -c "import os, sys; assert os.path.realpath(sys.executable).startswith(os.path.realpath(sys.argv[1])), sys.executable" "$RUNNER_TEMP/py312"
          test -x "$app/Contents/MacOS/applet"
          test -s "$app/Contents/Resources/applet.icns"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = io.github.rakuyou211-blip.texttovoicevox
          codesign --verify --deep "$app"
          if xattr -r "$d" "$app" | grep -q com.apple.quarantine; then echo "quarantine flag left"; exit 1; fi
          # 利用者と同じく Finder と同じ開き方（open）で起動し、窓の本体が動き続けるか
          open "$app"
          sleep 20
          # 「sh -c ... main.py」（起動役が挟むシェル）ではなく、Python 本体の方をつかむ
          pid="$(pgrep -f "^[^ ]*python[^ ]* $d/main.py" | head -n 1)"
          test -n "$pid" || { echo "the app did not start or exited early"; cat "$d/起動エラー.log" 2>/dev/null; exit 1; }
          # 本体は起動役のアプリ（applet）の子として動く（画面収録の許可が TextToVoicevox の名前で出るため）
          ps -o pid=,ppid=,command= -p "$pid"
          ps -o command= -p "$(ps -o ppid= -p "$(ps -o ppid= -p "$pid" | tr -d ' ')" | tr -d ' ')" | grep applet
          # 止まるのを待つ（止まる前に次の更新を流すと「起動中」と判定されて正しく止まる）
          kill "$pid"
          for i in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
          kill -9 "$pid" 2>/dev/null || true
          echo "app ok"

      - name: Re-run keeps user data (update)
        env:
          T2V_SRC: ${{ github.workspace }}
          T2V_DIR: ${{ runner.temp }}/t2v
          T2V_APPS: ${{ runner.temp }}/apps
          T2V_PY_DIR: ${{ runner.temp }}/py312
          T2V_OWN_PYTHON: "1"
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: |
          echo '{"keep": true}' > "$T2V_DIR/settings.json"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
          grep -q keep "$T2V_DIR/settings.json" || { echo "settings.json was lost"; exit 1; }
          echo "update kept settings.json"

      # 利用者と同じ道：GitHub の最新リリースの zip を取ってきて入れる（T2V_SRC なし）。
      # Python は、この Mac に入っているものを探して使う。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: One-line installer from the latest release
        env:
          T2V_DIR: ${{ runner.temp }}/t2v_release
          T2V_APPS: ${{ runner.temp }}/apps_release
          T2V_NO_LAUNCH: "1"
          T2V_YES: "1"
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
          test -x "$T2V_DIR/venv_mac/bin/python"
          test -x "$T2V_APPS/TextToVoicevox.app/Contents/MacOS/applet"
          test -f "$T2V_DIR/起動.command" || { echo "Japanese file names were broken"; ls "$T2V_DIR"; exit 1; }
          echo "release install ok"

  # 起動用 .exe（launcher/）をソースから作り、ダウンロードの印を外してから 起動.bat を
  # 動かすことを確かめる。Release ではこれを SignPath で署名して Windows 用 zip に入れる。
  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: powershell
        run: |
          pip install pillow
          powershell -NoProfile -ExecutionPolicy Bypass -File launcher\build.ps1 -Out "$env:RUNNER_TEMP\TextToVoicevox.exe"

      # SignPath checks the product name and version in the file's properties when it signs
      - name: The exe names its product and version
        shell: powershell
        run: |
          $v = (Get-Item (Join-Path $env:RUNNER_TEMP 'TextToVoicevox.exe')).VersionInfo
          $app = (Select-String -LiteralPath core.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "$($v.ProductName) $($v.ProductVersion) (file $($v.FileVersion))"
          if ($v.ProductName -ne 'TextToVoicevox') { throw "ProductName: $($v.ProductName)" }
          if ($v.ProductVersion -ne $app) { throw "ProductVersion $($v.ProductVersion) is not APP_VERSION $app" }

      - name: The exe removes the download mark and runs the launcher .bat
        shell: powershell
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'fakeapp'
          New-Item -ItemType Directory -Force -Path (Join-Path $d 'assets') | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'TextToVoicevox.exe') $d
          # main.py / core.py stubs and a fake launcher .bat (named with \u8d77\u52d5.bat via Python)
          python -c "import os,sys; d=sys.argv[1]; open(os.path.join(d,'main.py'),'w').close(); open(os.path.join(d,'core.py'),'w').close(); open(os.path.join(d,'assets','x.txt'),'w').close(); open(os.path.join(d,'\u8d77\u52d5.bat'),'w').write('@echo off\r\necho ok> %~dp0ran.txt\r\n')" $d
          foreach ($f in Get-ChildItem -LiteralPath $d -Recurse -File) {
            Set-Content -LiteralPath $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $marked = @(Get-ChildItem -LiteralPath $d -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          Write-Host "marked before: $($marked.Count)"
          # The exe itself is marked too, so run it through a copy without the mark (like a signed exe that the user allowed)
          Remove-Item -LiteralPath (Join-Path $d 'TextToVoicevox.exe') -Stream Zone.Identifier
          Start-Process -FilePath (Join-Path $d 'TextToVoicevox.exe') -WorkingDirectory $d -Wait
          for ($i = 0; $i -lt 40 -and -not (Test-Path (Join-Path $d 'ran.txt')); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path (Join-Path $d 'ran.txt'))) { throw 'the launcher .bat did not run' }
          $left = @(Get-ChildItem -LiteralPath $d -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          if ($left.Count) { throw "download marks left: $($left.FullName -join ', ')" }
          Write-Host 'launcher ok'
