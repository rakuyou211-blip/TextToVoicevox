name: Release zips

# Release を出したら、Windows 用と Mac 用の zip を作って、その Release に自動で添付する。
# 名前に版数を入れないので、README のダウンロードのリンク
#   https://github.com/<repo>/releases/latest/download/TextToVoicevox_Mac.zip
# は、版が変わっても同じまま最新版を指す。
# 付け忘れ・作り直しのときは、Actions の画面から手動でも動かせる（タグ名を入れる）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "zip を添付する Release のタグ（例: v1.22.0）"
        required: true

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build the zips
        run: python tools/make_release.py dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/TextToVoicevox_Windows.zip dist/TextToVoicevox_Mac.zip --clobber --repo "${{ github.repository }}"
